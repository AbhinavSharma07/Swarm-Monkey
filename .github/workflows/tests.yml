name: Tests

on:
  push:
    branches: [main, swarm-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install qa-swarm
        run: pip install -e .

      - name: Run tests
        run: pytest tests sample_app/tests -q
