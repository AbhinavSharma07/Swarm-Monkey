[project]
name = "qa-swarm"
version = "0.1.0"
description = "Autonomous multi-agent mutation testing and self-healing swarm (Aggressor / Detective / Surgeon), built on LangGraph."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "GitPython>=3.1",
    "libcst>=1.0",
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
qa-swarm = "qa_swarm.cli:main"

[tool.setuptools.packages.find]
include = ["qa_swarm*"]
